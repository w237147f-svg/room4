<!DOCTYPE HTML>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360度パノラマツアー</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #panorama { width: 100vw; height: 100vh; }
        
        /* クイズ用ホットスポット（電球アイコン）のスタイル */
        .bulb-hotspot {
            width: 60px; height: 60px;
            background-image: url('bulb.png');
            background-size: contain; background-repeat: no-repeat; background-position: center;
            cursor: pointer; opacity: 0.2; transition: all 0.3s ease;
        }
        .bulb-hotspot:hover { opacity: 1; transform: scale(1.1); }

        /* 新しい移動用ホットスポット（奥に向かって進む遠近感のある矢印）のスタイル */
        .custom-move-icon {
            width: 50px; height: 50px;
            /* 遠近感（パース）のついた矢印をSVGで描画 */
            background-image: url('data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 15 L85 60 L60 55 L65 90 L35 90 L40 55 L15 60 Z" fill="rgba(255,255,255,0.9)" stroke="%23333" stroke-width="3" stroke-linejoin="round" /></svg>');
            background-size: contain; background-repeat: no-repeat; background-position: center;
            cursor: pointer;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.6));
            transition: transform 0.2s;
        }
        .custom-move-icon:hover { transform: scale(1.2); }

        /* クイズ画面（モーダル）のスタイル */
        #quiz-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center;
        }
        .quiz-box { background: #fff; padding: 30px; border-radius: 10px; width: 80%; max-width: 500px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .quiz-btn { display: block; width: 100%; margin: 10px 0; padding: 12px; font-size: 16px; cursor: pointer; text-align: left; border: 1px solid #ccc; border-radius: 5px; background-color: #f9f9f9; }
        .quiz-btn:hover { background-color: #e9e9e9; }
        #quiz-result { margin-top: 20px; padding: 15px; border-radius: 5px; display: none; line-height: 1.5; }
        .close-btn { display: block; width: 100%; margin-top: 20px; padding: 10px; background: #333; color: #fff; cursor: pointer; border: none; border-radius: 5px; }
    </style>
</head>
<body>

<div id="panorama"></div>

<div id="quiz-overlay">
    <div class="quiz-box">
        <h3 style="margin-top: 0;">問題：</h3>
        <p id="quiz-text"></p>
        
        <div id="quiz-choices">
            <button class="quiz-btn" id="btn-A" onclick="answerQuiz('A')"></button>
            <button class="quiz-btn" id="btn-B" onclick="answerQuiz('B')"></button>
            <button class="quiz-btn" id="btn-C" onclick="answerQuiz('C')"></button>
        </div>
        
        <div id="quiz-result"></div>
        <button class="close-btn" onclick="closeQuiz()">閉じる</button>
    </div>
</div>

<script>
let currentQuiz = null;

function showQuiz(event, quizData) {
    currentQuiz = quizData;
    document.getElementById('quiz-text').innerHTML = quizData.question;
    document.getElementById('btn-A').innerText = quizData.choiceA;
    document.getElementById('btn-B').innerText = quizData.choiceB;
    document.getElementById('btn-C').innerText = quizData.choiceC;

    document.getElementById('quiz-overlay').style.display = 'flex';
    document.getElementById('quiz-choices').style.display = 'block';
    document.getElementById('quiz-result').style.display = 'none';
}

function answerQuiz(selectedChoice) {
    const resultDiv = document.getElementById('quiz-result');
    const choicesDiv = document.getElementById('quiz-choices');
    
    choicesDiv.style.display = 'none';
    resultDiv.style.display = 'block';

    if (selectedChoice === currentQuiz.correctAnswer) {
        resultDiv.style.backgroundColor = '#d4edda'; 
        resultDiv.style.color = '#155724';
        resultDiv.innerHTML = '<h3 style="margin-top:0; color:#28a745;">正解！</h3>' + 
                              '<p><strong>解説：</strong><br>' + currentQuiz.explanation + '</p>';
    } else {
        resultDiv.style.backgroundColor = '#f8d7da'; 
        resultDiv.style.color = '#721c24';
        resultDiv.innerHTML = '<h3 style="margin-top:0; color:#dc3545;">不正解...</h3>' + 
                              '<p>正解は <strong>' + currentQuiz.correctAnswer + '</strong> です。</p>' +
                              '<p><strong>解説：</strong><br>' + currentQuiz.explanation + '</p>';
    }
}

function closeQuiz() { 
    document.getElementById('quiz-overlay').style.display = 'none'; 
}

pannellum.viewer('panorama', {
    "default": {
        "firstScene": "scene1",
        "sceneFadeDuration": 1000,
        "autoLoad": true
    },
    "scenes": {
        "scene1": {
            "title": "地点1",
            "type": "equirectangular",
            "panorama": "66.jpg",
            "hotSpots": [
                { "pitch": -5, "yaw": 210, "type": "scene", "text": "地点2へ移動", "sceneId": "scene2", "targetYaw": "same", "targetPitch": "same", "cssClass": "custom-move-icon" },
                { "pitch": -5, "yaw": -30, "type": "scene", "text": "地点3へ移動", "sceneId": "scene3", "targetYaw": "same", "targetPitch": "same", "cssClass": "custom-move-icon" },
                { "pitch": -5, "yaw": 120, "type": "scene", "text": "地点4へ移動", "sceneId": "scene4", "targetYaw": "same", "targetPitch": "same", "cssClass": "custom-move-icon" },
                { "pitch": -5, "yaw": 30, "type": "scene", "text": "地点5へ移動", "sceneId": "scene5", "targetYaw": "same", "targetPitch": "same", "cssClass": "custom-move-icon" }
            ]
        },
        "scene2": {
            "title": "地点2",
            "type": "equirectangular",
            "panorama": "68.jpg",
            "hotSpots": [
                { "pitch": -5, "yaw": 30, "type": "scene", "text": "地点1へ移動", "sceneId": "scene1", "targetYaw": "same", "targetPitch": "same", "cssClass": "custom-move-icon" },
                { "pitch": -5, "yaw": 90, "type": "scene", "text": "地点4へ移動", "sceneId": "scene4", "targetYaw": "same", "targetPitch": "same", "cssClass": "custom-move-icon" },
                { 
                    "pitch": 0, "yaw": 160, "cssClass": "bulb-hotspot", 
                    "clickHandlerFunc": showQuiz,
                    "clickHandlerArgs": {
                        "question": "水の無駄を減らす行動として、適切なのはどれでしょう？",
                        "choiceA": "A．少しだけ水が出る状態にする",
                        "choiceB": "B．次の人が使うまで流しておく",
                        "choiceC": "C．蛇口を閉めて水を止める",
                        "correctAnswer": "C",
                        "explanation": "水を使っていないときに止めることで、使用水量を減らせます。節水は、水の供給や処理に伴うエネルギーの削減にもつながります。"
                    }
                }
            ]
        },
        "scene3": {
            "title": "地点3",
            "type": "equirectangular",
            "panorama": "200.jpg",
            "hotSpots": [
                { "pitch": -5, "yaw": 150, "type": "scene", "text": "地点1へ移動", "sceneId": "scene1", "targetYaw": "same", "targetPitch": "same", "cssClass": "custom-move-icon" },
                // ★ 修正：地点3から地点5への移動（0度から180度右に移動）
                { "pitch": -5, "yaw": 180, "type": "scene", "text": "地点5へ移動", "sceneId": "scene5", "targetYaw": "same", "targetPitch": "same", "cssClass": "custom-move-icon" },
                { 
                    "pitch": 0, "yaw": -65,
                    "cssClass": "bulb-hotspot", 
                    "clickHandlerFunc": showQuiz,
                    "clickHandlerArgs": {
                        "question": "誰もいない教室でエアコンが動いています。この後は使用予定がなく、利用者が停止してよい設備です。<br><br>冷暖房に使うエネルギーを減らすために、どうしますか？",
                        "choiceA": "A．エアコンを停止する",
                        "choiceB": "B．翌日まで運転を続ける",
                        "choiceC": "C．窓を開けて運転を続ける",
                        "correctAnswer": "A",
                        "explanation": "使用していない時間のエアコンを停止することで、運転時間を短縮し、エネルギー消費を減らせます。"
                    }
                }
            ]
        },
        "scene4": {
            "title": "地点4",
            "type": "equirectangular",
            "panorama": "201.jpg",
            "hotSpots": [
                { "pitch": -5, "yaw": -60, "type": "scene", "text": "地点1へ移動", "sceneId": "scene1", "targetYaw": "same", "targetPitch": "same", "cssClass": "custom-move-icon" },
                { "pitch": -5, "yaw": -90, "type": "scene", "text": "地点2へ移動", "sceneId": "scene2", "targetYaw": "same", "targetPitch": "same", "cssClass": "custom-move-icon" },
                { 
                    "pitch": -5, "yaw": 0,
                    "cssClass": "bulb-hotspot", 
                    "clickHandlerFunc": showQuiz,
                    "clickHandlerArgs": {
                        "question": "ゼミ室のモニター（テレビ）に関する行動で、脱炭素につながる実践として適切なのはどれでしょう？",
                        "choiceA": "A．休憩中もスクリーンセーバーを表示したままにする",
                        "choiceB": "B．使わないときはこまめに主電源を切る",
                        "choiceC": "C．常に明るさを最大にしておく",
                        "correctAnswer": "B",
                        "explanation": "ゼミ室を使わないときや長時間の休憩時は、モニターの主電源を切る（またはコンセントを抜く）ことで待機電力を削減できます。日々の節電の積み重ねが脱炭素につながります。"
                    }
                }
            ]
        },
        "scene5": {
            "title": "地点5",
            "type": "equirectangular",
            "panorama": "203.jpg",
            "hotSpots": [
                { "pitch": -5, "yaw": -150, "type": "scene", "text": "地点1へ移動", "sceneId": "scene1", "targetYaw": "same", "targetPitch": "same", "cssClass": "custom-move-icon" },
                // ★ 修正：地点5から地点3への戻るアイコン（180度の逆の0度）
                { "pitch": -5, "yaw": 0, "type": "scene", "text": "地点3へ移動", "sceneId": "scene3", "targetYaw": "same", "targetPitch": "same", "cssClass": "custom-move-icon" },
                { 
                    "pitch": -10, "yaw": 15,
                    "cssClass": "bulb-hotspot", 
                    "clickHandlerFunc": showQuiz,
                    "clickHandlerArgs": {
                        "question": "印刷をしていないコピー機が、スリープモードに入らず待機しています。<br><br>使用していない時間の電力消費を抑えるには、どの設定がよいでしょう？",
                        "choiceA": "A．操作画面を常に点灯させる",
                        "choiceB": "B．一定時間使わないとスリープモードになる設定",
                        "choiceC": "C．省電力機能を解除する設定",
                        "correctAnswer": "B",
                        "explanation": "コピー機のスリープ機能を活用すると、待機中の電力消費を抑えられます。共用機の設定は管理者に確認します。"
                    }
                }
            ]
        }
    }
});
</script>

</body>
</html>
