<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ゼミ室＆キャンパス探索クイズ（全100問・15問クリア）</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0b1120;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1rem;
    }

    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .hud {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 0.9rem;
    }

    .hud-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-box strong {
      color: var(--accent);
      font-size: 1.05rem;
    }

    .progress-wrap {
      width: 140px;
      height: 8px;
      background: var(--panel-2);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.3s ease;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      padding: 16px 20px 24px;
      max-width: 1380px;
      width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 960px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .stage-card {
      position: relative;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      min-height: 480px;
      display: flex;
      flex-direction: column;
    }

    .scene-viewport {
      position: relative;
      flex: 1;
      min-height: 430px;
      cursor: grab;
      overflow: hidden;
    }

    .scene-viewport:active {
      cursor: grabbing;
    }

    .scene-canvas {
      position: absolute;
      inset: 0;
      transition: background 0.35s ease;
    }

    .scene-overlay-info {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 5;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid var(--border);
      backdrop-filter: blur(6px);
      padding: 8px 14px;
      border-radius: 12px;
      pointer-events: none;
    }

    .scene-title {
      font-weight: 700;
      font-size: 1rem;
    }

    .scene-sub {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .compass {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 5;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      color: var(--accent);
      pointer-events: none;
    }

    .hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 6;
      border: 2px solid #fff;
      background: rgba(56, 189, 248, 0.88);
      color: #082f49;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 7px 11px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      transition: transform 0.15s ease, background 0.15s ease, opacity 0.2s ease;
      white-space: nowrap;
    }

    .hotspot:hover {
      transform: translate(-50%, -50%) scale(1.08);
      background: #7dd3fc;
    }

    .hotspot.solved {
      background: rgba(34, 197, 94, 0.85);
      color: #052e16;
      opacity: 0.68;
    }

    .hotspot.door {
      background: rgba(245, 158, 11, 0.92);
      color: #451a03;
    }

    .controls-bar {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button.btn {
      background: #334155;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 13px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    button.btn:hover {
      background: #475569;
    }

    button.btn:active {
      transform: scale(0.98);
    }

    button.btn.primary {
      background: var(--accent);
      color: #082f49;
      border-color: transparent;
    }

    button.btn.primary:hover {
      background: #7dd3fc;
    }

    button.btn.success {
      background: var(--accent-2);
      color: #052e16;
      border-color: transparent;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 0.98rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .area-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .area-btn {
      text-align: left;
      padding: 9px 10px;
      border-radius: 10px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.8rem;
      cursor: pointer;
    }

    .area-btn.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.14);
    }

    .area-btn small {
      display: block;
      color: var(--muted);
      margin-top: 2px;
    }

    .log-box {
      font-size: 0.83rem;
      color: var(--muted);
      line-height: 1.55;
      max-height: 220px;
      overflow-y: auto;
    }

    .log-item {
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* モーダル（クイズ＆15問クリア演出） */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.78);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      max-width: 540px;
      width: 100%;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }

    .diff-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .diff-easy { background: rgba(34, 197, 94, 0.2); color: #86efac; }
    .diff-med  { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; }
    .diff-hard { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }

    .question-text {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.55;
      margin: 6px 0 16px;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice-btn {
      text-align: left;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.92rem;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .choice-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
    }

    .choice-btn.correct {
      border-color: var(--accent-2);
      background: rgba(34, 197, 94, 0.2);
    }

    .choice-btn.wrong {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.2);
    }

    .feedback {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: var(--panel-2);
      font-size: 0.88rem;
      line-height: 1.5;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .modal-footer {
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>ゼミ室＆キャンパス探索クイズ</span>
      <span class="badge">全100問 / 15問正解でクリア</span>
    </div>
    <div class="hud">
      <div class="hud-box">
        <span>正解数</span>
        <strong id="correctCount">0</strong>
        <span>/ 15（全100問）</span>
      </div>
      <div class="hud-box">
        <span>クリア進捗</span>
        <div class="progress-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <span id="progressPct">0%</span>
      </div>
      <button class="btn" id="openQuickQuizBtn">今いるエリアの問題を解く</button>
    </div>
  </header>

  <main>
    <section class="stage-card">
      <div class="scene-viewport" id="sceneViewport" title="ドラッグまたは左右ボタンで視点を回転できます">
        <div class="scene-canvas" id="sceneCanvas"></div>
        <div class="scene-overlay-info">
          <div class="scene-title" id="sceneTitle">ゼミ室（スタート拠点）</div>
          <div class="scene-sub" id="sceneSub">ドラッグで視点回転・ピンをクリックしてクイズに挑戦</div>
        </div>
        <div class="compass" id="compass">北（0°）</div>
        <div id="hotspotsLayer"></div>
      </div>

      <div class="controls-bar">
        <div class="btn-group">
          <button class="btn" id="turnLeftBtn">← 左へ視点回転</button>
          <button class="btn" id="turnRightBtn">右へ視点回転 →</button>
          <button class="btn" id="resetYawBtn">北向きに戻す</button>
        </div>
        <div class="btn-group">
          <button class="btn primary" id="moveOutdoorBtn">外へ出る（中庭・キャンパスへ）</button>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="panel">
        <h2>
          <span>エリア移動</span>
          <small style="color: var(--muted); font-weight: 400;">全6エリア</small>
        </h2>
        <div class="area-list" id="areaList"></div>
      </div>

      <div class="panel">
        <h2>
          <span>探索ログ</span>
          <button class="btn" style="padding: 4px 8px; font-size: 0.75rem;" id="resetAllBtn">リセット</button>
        </h2>
        <div class="log-box" id="logBox">
          <div class="log-item">ゼミ室からスタートしました。まずは机やホワイトボード、エアコン周辺を調べてみましょう。</div>
        </div>
      </div>
    </aside>
  </main>

  <!-- クイズモーダル -->
  <div class="modal-backdrop" id="quizModal">
    <div class="modal">
      <span class="diff-tag" id="qDiffTag">中問</span>
      <div style="font-size: 0.8rem; color: var(--muted);" id="qMeta">問題 #1 / 100</div>
      <div class="question-text" id="qText">問題文</div>
      <div class="choices" id="qChoices"></div>
      <div class="feedback" id="qFeedback"></div>
      <div class="modal-footer">
        <button class="btn" id="closeQuizBtn">閉じる</button>
        <button class="btn primary" id="nextQuizBtn" style="display: none;">次の問題へ</button>
      </div>
    </div>
  </div>

  <!-- 15問クリアモーダル -->
  <div class="modal-backdrop" id="clearModal">
    <div class="modal">
      <span class="diff-tag diff-easy">CLEAR!</span>
      <h2 style="margin: 4px 0 8px; font-size: 1.35rem;">15問正解達成！一応クリアおめでとうございます</h2>
      <p style="color: var(--muted); font-size: 0.92rem; line-height: 1.6; margin: 0 0 16px;">
        大学生向けの基準ライン（15問正解）をクリアしました。<br>
        このまま残りの問題（全100問）に挑戦してコンプリートを目指すことも、ここで終了することもできます。
      </p>
      <div class="modal-footer" style="justify-content: flex-start;">
        <button class="btn success" id="continuePlayBtn">そのまま続ける（残り問題に挑戦）</button>
        <button class="btn" id="finishPlayBtn">ここで終了する</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 設定・状態管理
    // ==========================================
    const CLEAR_GOAL = 15;
    const TOTAL_QUESTIONS = 100;

    const AREAS = [
      {
        id: "seminar_room",
        name: "ゼミ室（スタート）",
        isOutdoor: false,
        sub: "ホワイトボード・長机・エアコン・プロジェクターがある拠点",
        bg: "radial-gradient(circle at 50% 35%, #1e3a5f 0%, #0f172a 75%)",
        range: [1, 20]
      },
      {
        id: "hallway",
        name: "研究室前の廊下",
        isOutdoor: false,
        sub: "掲示板・給水機・ごみ箱・非常口案内が並ぶ通路",
        bg: "linear-gradient(135deg, #1e293b 0%, #0f172a 100%)",
        range: [21, 36]
      },
      {
        id: "library_lounge",
        name: "ラーニングコモンズ",
        isOutdoor: false,
        sub: "グループ作業スペース・電源席・プリンターコーナー",
        bg: "radial-gradient(circle at 30% 30%, #1d4ed8 0%, #0f172a 75%)",
        range: [37, 52]
      },
      {
        id: "courtyard",
        name: "中庭（外エリア）",
        isOutdoor: true,
        sub: "ベンチ・植栽・駐輪場・太陽光パネルが見える屋外スペース",
        bg: "linear-gradient(180deg, #0369a1 0%, #14532d 65%, #0f172a 100%)",
        range: [53, 68]
      },
      {
        id: "campus_walk",
        name: "キャンパス並木道",
        isOutdoor: true,
        sub: "学食棟へ続く歩道・街灯・自販機・ゴミ分別ステーション",
        bg: "linear-gradient(160deg, #0284c7 0%, #15803d 60%, #1e293b 100%)",
        range: [69, 84]
      },
      {
        id: "rooftop_deck",
        name: "展望デッキ（外エリア）",
        isOutdoor: true,
        sub: "風向計・校舎全景・ソーラーベンチがある開放エリア",
        bg: "linear-gradient(180deg, #0ea5e9 0%, #1e3a8a 60%, #0f172a 100%)",
        range: [85, 100]
      }
    ];

    // 100問分のデータ生成（易30 / 中50 / 難20 のバランス。実データに差し替え可能）
    function create100Questions() {
      const bank = [];
      const templatesEasy = [
        {
          q: "ゼミ室で誰もいない時間帯に照明を消す行動は、主にどの資源の節約につながる？",
          choices: ["電力の消費削減", "上水道の使用量削減", "紙資源の削減"],
          ans: 0,
          exp: "照明の消灯は最もシンプルで効果的な節電アクションの一つです。"
        },
        {
          q: "ペットボトルをリサイクルに出す前に行う基本のひと手間として正しいものはどれ？",
          choices: ["キャップとラベルを外し、中をすすぐ", "潰さずにそのまま燃えるごみへ入れる", "油分が残ったまま他のプラと混ぜる"],
          ans: 0,
          exp: "分別ルールを守ることで再生資源の品質が保たれます。"
        },
        {
          q: "資料を印刷する前に「両面印刷」や「集約印刷」を選ぶ主なメリットは？",
          choices: ["紙の使用量と印刷コストを減らせる", "インクの乾燥時間がゼロになる", "モニターの輝度が自動で下がる"],
          ans: 0,
          exp: "1枚あたりの情報量を増やすことで紙資源の消費を抑えられます。"
        }
      ];

      const templatesMed = [
        {
          q: "エアコンの設定温度を冬場に1℃下げた場合の一般的な省エネ効果の目安に近いものはどれ？",
          choices: ["約10%前後の消費電力削減", "約50%以上の消費電力削減", "消費電力は一切変わらない"],
          ans: 0,
          exp: "冷暖房は空調設定の見直しによる消費電力の変化が大きい設備です。"
        },
        {
          q: "キャンパス内の自動販売機や共用設備で「待機電力」を抑える考え方として適切なのはどれ？",
          choices: ["長時間使わない機器の主電源や省エネモードを活用する", "使っていないモニターを最大輝度で点けっぱなしにする", "冷房と暖房を同時に稼働させる"],
          ans: 0,
          exp: "使わない時間の無駄な電力消費を減らすことが基本になります。"
        },
        {
          q: "大学のグループワークでクラウド資料共有を活用する利点として最も妥当なものはどれ？",
          choices: ["不要な紙出力や版管理のミスを減らせる", "通信量が常にゼロになる", "バッテリー消費が必ずなくなる"],
          ans: 0,
          exp: "紙の刷り直しを減らしつつ、共同編集の効率も高められます。"
        }
      ];

      const templatesHard = [
        {
          q: "【難問】電力需要が逼迫しやすい時間帯（ピーク時）に、節電行動の社会的価値が高まる理由はどれ？",
          choices: ["発電設備の限界や需給バランスの崩れを防ぎやすいため", "昼間は太陽光発電が完全に停止するため", "送電線の抵抗が夜間に必ずゼロになるため"],
          ans: 0,
          exp: "総量だけでなく「どの時間帯に使うか（デマンド・ピークシフト）」も重要です。"
        },
        {
          q: "【難問】製品のライフサイクル全体（LCA）で環境負荷を考えるとき、見落としやすい視点はどれ？",
          choices: ["製造・輸送・廃棄まで含めたトータルの排出・負荷", "店頭でのパッケージの色味だけ", "購入直後の1日だけの使用状態"],
          ans: 0,
          exp: "使用時だけでなく、作る前・運ぶとき・手放すときの工程全体を見るのがポイントです。"
        }
      ];

      for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
        const area = AREAS.find(a => i >= a.range[0] && i <= a.range[1]) || AREAS[0];
        // 易30問 / 中50問 / 難20問 の比率
        let diff = "med";
        if (i % 10 <= 3 && i % 10 >= 1) diff = "easy";
        else if (i % 5 === 0) diff = "hard";

        const pool = diff === "easy" ? templatesEasy : diff === "hard" ? templatesHard : templatesMed;
        const tpl = pool[(i - 1) % pool.length];

        bank.push({
          id: i,
          areaId: area.id,
          diff,
          label: `Q${i}（${area.name.split("（")[0]}）`,
          question: `${tpl.q} [No.${i}]`,
          choices: tpl.choices,
          answerIndex: tpl.ans,
          explanation: tpl.exp,
          yaw: ((i * 53) % 360),
          top: 28 + ((i * 19) % 46),
          left: 18 + ((i * 29) % 64)
        });
      }
      return bank;
    }

    const state = {
      currentAreaId: "seminar_room",
      yaw: 0, // 0〜359度（北=0）
      correctIds: new Set(),
      triedIds: new Set(),
      clearedModalShown: false,
      questions: create100Questions(),
      activeQuestionId: null,
      isDragging: false,
      dragStartX: 0,
      dragStartYaw: 0
    };

    // ==========================================
    // 2. 描画・UI更新
    // ==========================================
    const sceneViewport = document.getElementById("sceneViewport");
    const sceneCanvas = document.getElementById("sceneCanvas");
    const hotspotsLayer = document.getElementById("hotspotsLayer");
    const sceneTitle = document.getElementById("sceneTitle");
    const sceneSub = document.getElementById("sceneSub");
    const compass = document.getElementById("compass");
    const areaList = document.getElementById("areaList");
    const logBox = document.getElementById("logBox");

    function getCurrentArea() {
      return AREAS.find(a => a.id === state.currentAreaId) || AREAS[0];
    }

    function normalizeYaw(deg) {
      return ((deg % 360) + 360) % 360;
    }

    function getDirectionLabel(deg) {
      const dirs = ["北", "北東", "東", "南東", "南", "南西", "西", "北西"];
      const idx = Math.round(normalizeYaw(deg) / 45) % 8;
      return `${dirs[idx]}（${Math.round(normalizeYaw(deg))}°）`;
    }

    function addLog(text) {
      const div = document.createElement("div");
      div.className = "log-item";
      div.textContent = text;
      logBox.prepend(div);
    }

    function updateHud() {
      const count = state.correctIds.size;
      document.getElementById("correctCount").textContent = String(count);
      const pct = Math.min(100, Math.round((count / CLEAR_GOAL) * 100));
      document.getElementById("progressBar").style.width = `${pct}%`;
      document.getElementById("progressPct").textContent = `${pct}%`;

      if (count >= CLEAR_GOAL && !state.clearedModalShown) {
        state.clearedModalShown = true;
        document.getElementById("clearModal").classList.add("open");
        addLog(`【達成】${CLEAR_GOAL}問正解を達成しました！そのまま全100問探索を続けることもできます。`);
      }
    }

    function renderAreaButtons() {
      areaList.innerHTML = "";
      AREAS.forEach(area => {
        const areaQs = state.questions.filter(q => q.areaId === area.id);
        const solvedInArea = areaQs.filter(q => state.correctIds.has(q.id)).length;
        const btn = document.createElement("button");
        btn.className = `area-btn ${area.id === state.currentAreaId ? "active" : ""}`;
        btn.innerHTML = `
          <div>${area.name}</div>
          <small>正解 ${solvedInArea}/${areaQs.length}問 ${area.isOutdoor ? "・屋外" : "・室内"}</small>
        `;
        btn.onclick = () => switchArea(area.id);
        areaList.appendChild(btn);
      });
    }

    function renderScene() {
      const area = getCurrentArea();
      state.yaw = normalizeYaw(state.yaw);
      sceneTitle.textContent = area.name;
      sceneSub.textContent = area.sub;
      compass.textContent = getDirectionLabel(state.yaw);

      // 視点回転に合わせて背景グラデーション位置をずらす（パノラマ視点の疑似表現）
      const shiftX = ((state.yaw / 360) * 100).toFixed(1);
      sceneCanvas.style.background = area.bg;
      sceneCanvas.style.backgroundPosition = `${shiftX}% 50%`;

      const moveBtn = document.getElementById("moveOutdoorBtn");
      if (area.id === "seminar_room") {
        moveBtn.textContent = "外へ出る（中庭・キャンパスへ）";
      } else if (area.isOutdoor) {
        moveBtn.textContent = "ゼミ室へ戻る（スタート拠点）";
      } else {
        moveBtn.textContent = "外へ出る（中庭・キャンパスへ）";
      }

      hotspotsLayer.innerHTML = "";
      const areaQuestions = state.questions.filter(q => q.areaId === area.id);

      // 現在の視点（yaw）に近い問題を最大6個ピン表示（見やすさ重視）
      const visibleQs = areaQuestions
        .map(q => {
          const diffYaw = Math.abs(((q.yaw - state.yaw + 540) % 360) - 180);
          return { q, diffYaw };
        })
        .sort((a, b) => a.diffYaw - b.diffYaw)
        .slice(0, 6);

      visibleQs.forEach(({ q, diffYaw }) => {
        const pin = document.createElement("button");
        const isSolved = state.correctIds.has(q.id);
        pin.className = `hotspot ${isSolved ? "solved" : ""}`;
        pin.style.top = `${q.top}%`;
        // 視点差を横位置に反映
        const relOffset = Math.max(-35, Math.min(35, ((q.yaw - state.yaw + 540) % 360 - 180) * 0.35));
        pin.style.left = `${Math.max(12, Math.min(88, q.left + relOffset))}%`;
        pin.style.opacity = diffYaw > 120 ? "0.45" : "1";
        pin.textContent = isSolved ? `✓ ${q.label}` : q.label;
        pin.onclick = (e) => {
          e.stopPropagation();
          openQuestion(q.id);
        };
        hotspotsLayer.appendChild(pin);
      });

      renderAreaButtons();
    }

    function switchArea(areaId) {
      const target = AREAS.find(a => a.id === areaId);
      if (!target) return;
      state.currentAreaId = areaId;
      state.yaw = 0;
      addLog(`「${target.name}」に移動しました。`);
      renderScene();
    }

    // ==========================================
    // 3. クイズモーダル制御
    // ==========================================
    const quizModal = document.getElementById("quizModal");
    const qDiffTag = document.getElementById("qDiffTag");
    const qMeta = document.getElementById("qMeta");
    const qText = document.getElementById("qText");
    const qChoices = document.getElementById("qChoices");
    const qFeedback = document.getElementById("qFeedback");
    const nextQuizBtn = document.getElementById("nextQuizBtn");

    function openQuestion(qId) {
      const q = state.questions.find(item => item.id === qId);
      if (!q) return;
      state.activeQuestionId = qId;

      qDiffTag.className = "diff-tag";
      if (q.diff === "easy") {
        qDiffTag.classList.add("diff-easy");
        qDiffTag.textContent = "易問（観察・基本）";
      } else if (q.diff === "hard") {
        qDiffTag.classList.add("diff-hard");
        qDiffTag.textContent = "難問（応用・思考）";
      } else {
        qDiffTag.classList.add("diff-med");
        qDiffTag.textContent = "中問（探索・理解）";
      }

      qMeta.textContent = `問題 #${q.id} / ${TOTAL_QUESTIONS} ｜ 現在 ${state.correctIds.size} 問正解（目標 ${CLEAR_GOAL} 問）`;
      qText.textContent = q.question;
      qFeedback.className = "feedback";
      qFeedback.textContent = "";
      nextQuizBtn.style.display = "none";
      qChoices.innerHTML = "";

      q.choices.forEach((choiceText, idx) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = `${idx + 1}. ${choiceText}`;
        btn.onclick = () => handleAnswer(q, idx, btn);
        qChoices.appendChild(btn);
      });

      quizModal.classList.add("open");
    }

    function handleAnswer(q, chosenIdx, clickedBtn) {
      state.triedIds.add(q.id);
      const allBtns = qChoices.querySelectorAll(".choice-btn");
      allBtns.forEach(b => (b.disabled = true));

      const isCorrect = chosenIdx === q.answerIndex;
      if (isCorrect) {
        clickedBtn.classList.add("correct");
        const firstTimeCorrect = !state.correctIds.has(q.id);
        state.correctIds.add(q.id);
        qFeedback.innerHTML = `<strong style="color:#86efac;">正解！</strong> ${q.explanation}`;
        if (firstTimeCorrect) {
          addLog(`Q${q.id} に正解（累計 ${state.correctIds.size} 問正解）`);
        }
        updateHud();
      } else {
        clickedBtn.classList.add("wrong");
        allBtns[q.answerIndex].classList.add("correct");
        qFeedback.innerHTML = `<strong style="color:#fca5a5;">不正解。</strong> ${q.explanation}`;
        addLog(`Q${q.id} で不正解（解説を確認）`);
      }

      qFeedback.classList.add("show");
      nextQuizBtn.style.display = "inline-block";
      renderScene();
    }

    function openNextUnsolvedInCurrentArea() {
      const area = getCurrentArea();
      const candidates = state.questions.filter(
        q => q.areaId === area.id && !state.correctIds.has(q.id) && q.id !== state.activeQuestionId
      );
      const fallback = state.questions.filter(q => !state.correctIds.has(q.id));
      const nextQ = candidates[0] || fallback[0];
      if (nextQ) {
        if (nextQ.areaId !== state.currentAreaId) {
          switchArea(nextQ.areaId);
        }
        openQuestion(nextQ.id);
      } else {
        quizModal.classList.remove("open");
        addLog("全100問を制覇しました！");
      }
    }

    // ==========================================
    // 4. イベント登録
    // ==========================================
    document.getElementById("turnLeftBtn").onclick = () => {
      state.yaw -= 30;
      renderScene();
    };
    document.getElementById("turnRightBtn").onclick = () => {
      state.yaw += 30;
      renderScene();
    };
    document.getElementById("resetYawBtn").onclick = () => {
      state.yaw = 0;
      renderScene();
    };

    document.getElementById("moveOutdoorBtn").onclick = () => {
      const area = getCurrentArea();
      if (area.isOutdoor) {
        switchArea("seminar_room");
      } else {
        switchArea("courtyard");
      }
    };

    document.getElementById("openQuickQuizBtn").onclick = () => {
      const area = getCurrentArea();
      const firstInArea = state.questions.find(q => q.areaId === area.id && !state.correctIds.has(q.id))
        || state.questions.find(q => q.areaId === area.id);
      if (firstInArea) openQuestion(firstInArea.id);
    };

    document.getElementById("closeQuizBtn").onclick = () => {
      quizModal.classList.remove("open");
    };

    nextQuizBtn.onclick = () => {
      openNextUnsolvedInCurrentArea();
    };

    document.getElementById("continuePlayBtn").onclick = () => {
      document.getElementById("clearModal").classList.remove("open");
    };

    document.getElementById("finishPlayBtn").onclick = () => {
      document.getElementById("clearModal").classList.remove("open");
      addLog(`プレイを終了しました（最終正解数: ${state.correctIds.size} / 100問）。`);
    };

    document.getElementById("resetAllBtn").onclick = () => {
      state.correctIds.clear();
      state.triedIds.clear();
      state.clearedModalShown = false;
      state.currentAreaId = "seminar_room";
      state.yaw = 0;
      logBox.innerHTML = "";
      addLog("進捗をリセットし、ゼミ室から再開しました。");
      updateHud();
      renderScene();
    };

    // ドラッグで視点回転
    sceneViewport.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".hotspot")) return;
      state.isDragging = true;
      state.dragStartX = e.clientX;
      state.dragStartYaw = state.yaw;
      sceneViewport.setPointerCapture(e.pointerId);
    });

    sceneViewport.addEventListener("pointermove", (e) => {
      if (!state.isDragging) return;
      const dx = e.clientX - state.dragStartX;
      state.yaw = state.dragStartYaw - dx * 0.35;
      renderScene();
    });

    sceneViewport.addEventListener("pointerup", () => {
      state.isDragging = false;
    });

    // 初期描画
    updateHud();
    renderScene();
  </script>
</body>
</html>
