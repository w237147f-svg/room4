<!DOCTYPE HTML>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360度パノラマツアー</title>
    <!-- PannellumのCSSとJavaScriptを読み込む -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        /* 画面いっぱいにパノラマを表示する設定 */
        body {
            margin: 0;
            padding: 0;
        }
        #panorama {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

<div id="panorama"></div>

<script>
// パノラマビューアーの初期化と設定
pannellum.viewer('panorama', {
    "default": {
        "firstScene": "scene1", // 最初に表示するシーン
        "sceneFadeDuration": 1000, // シーン切り替え時のフェード時間（ミリ秒）
        "autoLoad": true // 自動で画像を読み込む
    },

    "scenes": {
        // --- 地点1 (66.jpg) の設定 ---
        "scene1": {
            "title": "地点1",
            "type": "equirectangular",
            "panorama": "66.jpg",
            "hotSpots": [
                {
                    "pitch": -5, // 少し下を見る角度（目線の高さ調整）
                    "yaw": 150,  // ★ 画像の中央(0度)から150度の位置
                    "type": "scene",
                    "text": "地点2へ移動",
                    "sceneId": "scene2",
                    "targetYaw": "same",   // 移動後もカメラの向きを維持
                    "targetPitch": "same"  
                }
            ]
        },
        // --- 地点2 (68.jpg) の設定 ---
        "scene2": {
            "title": "地点2",
            "type": "equirectangular",
            "panorama": "68.jpg",
            "hotSpots": [
                {
                    "pitch": -5,
                    "yaw": -30,  // ★ 150度から来たので、真後ろの方向 (150 - 180 = -30度)
                    "type": "scene",
                    "text": "地点1へ移動",
                    "sceneId": "scene1",
                    "targetYaw": "same",   // 移動後もカメラの向きを維持
                    "targetPitch": "same"  
                }
            ]
        }
    }
});
</script>

</body>
</html>
