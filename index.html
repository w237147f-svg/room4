<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>キャンパス探索クイズ（全100問・15問クリア）</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: rgba(15, 23, 42, 0.88);
      --panel-solid: #1e293b;
      --panel-dark: #0b1120;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 上部最小限HUD */
    header {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .hud-card {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .location-name {
      font-weight: 700;
      font-size: 0.98rem;
    }

    .location-desc {
      font-size: 0.76rem;
      color: var(--muted);
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.86rem;
    }

    .stat-pill strong {
      color: var(--accent);
      font-size: 1.05rem;
    }

    .progress-wrap {
      width: 110px;
      height: 7px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.3s ease;
    }

    /* メイン360度風探索ビューポート */
    .viewport {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      cursor: grab;
      overflow: hidden;
    }

    .viewport:active {
      cursor: grabbing;
    }

    .panorama-world {
      position: absolute;
      inset: 0;
      transition: background 0.45s ease;
    }

    /* 空間の奥行き・グリッド演出（パノラマ回転の目安） */
    .panorama-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 90px 90px;
      pointer-events: none;
    }

    /* コンパス（北基準） */
    .compass-hud {
      position: fixed;
      top: 72px;
      right: 14px;
      z-index: 15;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: var(--accent);
      pointer-events: none;
    }

    /* 空間内のオブジェクト（クイズ対象箇所） */
    .hotspot-target {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.25s ease;
    }

    .hotspot-target:hover {
      transform: translate(-50%, -50%) scale(1.1);
    }

    .hotspot-ring {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.24);
      border: 2px solid #7dd3fc;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.9rem;
      color: #fff;
      animation: pulseRing 2.2s infinite;
    }

    .hotspot-target.solved .hotspot-ring {
      background: rgba(34, 197, 94, 0.26);
      border-color: #86efac;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
      animation: none;
    }

    .hotspot-label {
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.74rem;
      white-space: nowrap;
      color: #f8fafc;
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* ストリートビュー風 移動アイコン（透明感＋立体感） */
    .nav-arrow {
      position: absolute;
      transform: translate(-50%, -50%) perspective(360px) rotateX(42deg);
      z-index: 12;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.12) 65%, rgba(15, 23, 42, 0.35));
      border: 2px solid rgba(255, 255, 255, 0.72);
      box-shadow:
        0 10px 22px rgba(0, 0, 0, 0.5),
        inset 0 2px 6px rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .nav-arrow:hover {
      transform: translate(-50%, -50%) perspective(360px) rotateX(36deg) scale(1.1);
      background: radial-gradient(circle at 35% 30%, rgba(125, 211, 252, 0.65), rgba(56, 189, 248, 0.25) 70%);
      box-shadow:
        0 14px 28px rgba(56, 189, 248, 0.45),
        inset 0 2px 8px rgba(255, 255, 255, 0.75);
    }

    .nav-arrow svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
    }

    .nav-arrow-caption {
      position: absolute;
      bottom: -24px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: none;
    }

    /* 下部操作バー（視点回転＆ヒントのみ） */
    .bottom-bar {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .btn {
      background: rgba(51, 65, 85, 0.85);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: rgba(71, 85, 105, 0.95);
    }

    .btn.primary {
      background: var(--accent);
      color: #082f49;
      border-color: transparent;
    }

    .btn.success {
      background: var(--accent-2);
      color: #052e16;
      border-color: transparent;
    }

    .toast {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--border);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 0.82rem;
      color: #e2e8f0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .toast.show {
      opacity: 1;
    }

    /* モーダル */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.76);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: 18px;
      max-width: 520px;
      width: 100%;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    .diff-tag {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .diff-easy { background: rgba(34, 197, 94, 0.2); color: #86efac; }
    .diff-med  { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; }
    .diff-hard { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }

    .question-text {
      font-size: 1.04rem;
      font-weight: 700;
      line-height: 1.55;
      margin: 8px 0 16px;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .choice-btn {
      text-align: left;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--panel-dark);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.92rem;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .choice-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
    }

    .choice-btn.correct {
      border-color: var(--accent-2);
      background: rgba(34, 197, 94, 0.22);
    }

    .choice-btn.wrong {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.22);
    }

    .feedback {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: var(--panel-dark);
      font-size: 0.87rem;
      line-height: 1.5;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .modal-footer {
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>
  <header>
    <div class="hud-card">
      <div>
        <div class="location-name" id="locationName">ゼミ室（スタート拠点）</div>
        <div class="location-desc" id="locationDesc">視点を回して気になる箇所をクリック／矢印で移動</div>
      </div>
    </div>

    <div class="hud-card">
      <div class="stat-pill">
        <span>発見・正解</span>
        <strong id="correctCount">0</strong>
        <span>/ 15問（全100問）</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <button class="btn" id="resetBtn" title="最初からやり直す">リセット</button>
    </div>
  </header>

  <div class="compass-hud" id="compassHud">北（0°）</div>

  <main class="viewport" id="viewport">
    <div class="panorama-world" id="panoramaWorld"></div>
    <div class="panorama-grid" id="panoramaGrid"></div>
    <div id="interactiveLayer"></div>
  </main>

  <div class="toast" id="toast"></div>

  <div class="bottom-bar">
    <button class="btn" id="turnLeftBtn">← 左を見る</button>
    <button class="btn" id="northBtn">北向き</button>
    <button class="btn" id="turnRightBtn">右を見る →</button>
  </div>

  <!-- クイズモーダル（空間内の箇所を見つけてクリックしたときのみ開く） -->
  <div class="modal-backdrop" id="quizModal">
    <div class="modal">
      <span class="diff-tag" id="qDiffTag">中問</span>
      <div style="font-size: 0.8rem; color: var(--muted);" id="qMeta">発見箇所：ゼミ室 / 問題 #1</div>
      <div class="question-text" id="qText">問題文</div>
      <div class="choices" id="qChoices"></div>
      <div class="feedback" id="qFeedback"></div>
      <div class="modal-footer">
        <button class="btn primary" id="closeQuizBtn">探索に戻る</button>
      </div>
    </div>
  </div>

  <!-- 15問正解クリア通知（探索状態は維持したまま続行可能） -->
  <div class="modal-backdrop" id="clearModal">
    <div class="modal">
      <span class="diff-tag diff-easy">CLEAR!</span>
      <h2 style="margin: 4px 0 8px; font-size: 1.3rem;">15問正解を達成しました！</h2>
      <p style="color: var(--muted); font-size: 0.9rem; line-height: 1.6; margin: 0 0 16px;">
        クリア基準の15問に到達しました。<br>
        このまま校内・屋外を自由に歩き回り、残りの問題（全100問）を探し続けることもできます。
      </p>
      <div class="modal-footer" style="justify-content: flex-start;">
        <button class="btn success" id="continueExploreBtn">探索を続ける（残り問題を探す）</button>
        <button class="btn" id="finishBtn">終了して結果を見る</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // 1. 学校内・屋外マップ定義（空間内の矢印移動でつながる構造）
    // =========================================================
    const CLEAR_GOAL = 15;
    const TOTAL_QUESTIONS = 100;

    // 各シーンの背景（実運用時はここにパノラマ画像URLを設定可能）と隣接シーンへの移動矢印
    const SCENES = {
      seminar_room: {
        id: "seminar_room",
        name: "ゼミ室（スタート拠点）",
        desc: "長机・エアコン・ホワイトボード・テレビがある部屋",
        bg: "radial-gradient(circle at 50% 40%, #1e3a5f 0%, #0f172a 78%)",
        links: [
          { target: "hallway_1", yaw: 90, top: 68, label: "廊下へ出る" },
          { target: "break_corner", yaw: 270, top: 68, label: "休憩スペースへ" }
        ]
      },
      break_corner: {
        id: "break_corner",
        name: "ゼミ室・休憩コーナー",
        desc: "給湯ポット・冷蔵庫・分別ゴミ箱・ペットボトルが置かれた一角",
        bg: "radial-gradient(circle at 40% 45%, #1d4ed8 0%, #0f172a 78%)",
        links: [
          { target: "seminar_room", yaw: 90, top: 68, label: "ゼミ室中央へ戻る" }
        ]
      },
      hallway_1: {
        id: "hallway_1",
        name: "研究棟 2F 廊下",
        desc: "掲示板・コピー機・照明スイッチ・階段への通路",
        bg: "linear-gradient(135deg, #1e293b 0%, #0f172a 100%)",
        links: [
          { target: "seminar_room", yaw: 270, top: 68, label: "ゼミ室へ入る" },
          { target: "learning_commons", yaw: 0, top: 68, label: "ラーニングコモンズへ" },
          { target: "entrance_hall", yaw: 180, top: 70, label: "1F エントランスへ" }
        ]
      },
      learning_commons: {
        id: "learning_commons",
        name: "ラーニングコモンズ",
        desc: "大型モニター・電源席・共同作業テーブルが並ぶエリア",
        bg: "radial-gradient(circle at 60% 35%, #0f766e 0%, #0f172a 78%)",
        links: [
          { target: "hallway_1", yaw: 180, top: 68, label: "2F 廊下へ戻る" }
        ]
      },
      entrance_hall: {
        id: "entrance_hall",
        name: "1F エントランスホール",
        desc: "自動ドア・デジタルサイネージ・傘立て・中庭への出口",
        bg: "linear-gradient(160deg, #334155 0%, #0f172a 100%)",
        links: [
          { target: "hallway_1", yaw: 0, top: 68, label: "2F 廊下へ上がる" },
          { target: "courtyard", yaw: 120, top: 68, label: "外へ出る（中庭）" }
        ]
      },
      courtyard: {
        id: "courtyard",
        name: "中庭（屋外エリア）",
        desc: "ベンチ・植栽・太陽光パネル・自販機がある屋外広場",
        bg: "linear-gradient(180deg, #0369a1 0%, #14532d 62%, #0f172a 100%)",
        links: [
          { target: "entrance_hall", yaw: 300, top: 68, label: "校舎内へ入る" },
          { target: "campus_walk", yaw: 60, top: 68, label: "並木道へ進む" }
        ]
      },
      campus_walk: {
        id: "campus_walk",
        name: "キャンパス並木道（屋外）",
        desc: "駐輪場・LED街灯・学食棟前・リサイクルステーション",
        bg: "linear-gradient(170deg, #0284c7 0%, #15803d 58%, #1e293b 100%)",
        links: [
          { target: "courtyard", yaw: 240, top: 68, label: "中庭へ戻る" }
        ]
      }
    };

    // =========================================================
    // 2. 全100問の空間配置データ生成（各シーンの特定座標・角度に配置）
    // =========================================================
    const SPOT_NAMES_BY_SCENE = {
      seminar_room: ["エアコンリモコン", "ホワイトボード", "窓際のブラインド", "プロジェクター", "長机の電源タップ", "天井照明スイッチ"],
      break_corner: ["机上のペットボトル", "電気ポット", "小型冷蔵庫", "分別ゴミ箱", "マイボトル置き場"],
      hallway_1: ["共用コピー機", "省エネ啓発ポスター", "廊下のセンサー照明", "掲示板の資料", "階段前の案内板"],
      learning_commons: ["大型ディスプレイ", "グループ席のコンセント", "プリンター複合機", "空調吹き出し口", "換気モニター"],
      entrance_hall: ["自動ドア", "消費電力モニター", "宅配ロッカー", "ロビー照明"],
      courtyard: ["ソーラーベンチ", "屋外自販機", "屋上太陽光パネル案内", "緑化スペース", "雨水タンク"],
      campus_walk: ["LED街灯", "学食前の分別BOX", "シェアサイクル駐輪場", "木陰のベンチ", "掲示スタンド"]
    };

    function generate100SpatialQuestions() {
      const sceneKeys = Object.keys(SCENES);
      const templatesEasy = [
        {
          q: "ゼミ室や教室を最後に退室するとき、照明やモニターの電源を切ることで直接減らせるものは？",
          choices: ["待機電力・無駄な消費電力", "建物の床面積", "Wi-Fiの通信速度"],
          ans: 0,
          exp: "使っていない機器の電源オフは最も基本で確実な節電行動です。"
        },
        {
          q: "ペットボトルを捨てる際、リサイクルの品質を保つために行うべき行動はどれ？",
          choices: ["キャップとラベルを外し、中を軽くすすぐ", "飲み残しを入れたまま潰す", "燃えるごみ袋にそのまま混ぜる"],
          ans: 0,
          exp: "素材ごとに正しく分別することで再資源化率が大きく向上します。"
        },
        {
          q: "ゼミ発表のレジュメを印刷する際、紙資源を半分に減らせる設定はどれ？",
          choices: ["両面印刷（または2ページ集約）", "片面カラー拡大印刷", "余白を最大にして1行ずつ印刷"],
          ans: 0,
          exp: "両面印刷・集約印刷は大学の資料作成ですぐ実践できる工夫です。"
        }
      ];

      const templatesMed = [
        {
          q: "冷暖房の効きを良くし、エアコンの消費電力を抑えるために有効な窓際の工夫はどれ？",
          choices: ["ブラインドやカーテンで直射日光や冷気を遮る", "窓を全開にしたまま冷房を強風にする", "室外機の吹き出し口を荷物で塞ぐ"],
          ans: 0,
          exp: "窓からの熱の出入りを抑えると空調負荷が大きく下がります。"
        },
        {
          q: "自動販売機や冷蔵庫の省エネ運用として、大学キャンパスでも導入されている仕組みはどれ？",
          choices: ["ピーク時間帯に冷却を控えるヒートポンプ・ピークカット機能", "24時間ずっと最大出力で加熱と冷却を同時に行う機能", "扉を開けたまま保冷する機能"],
          ans: 0,
          exp: "電力需要のピークを避けて冷却する技術により消費電力を抑えています。"
        },
        {
          q: "複数の家電を1つの電源タップに繋いでいるとき、節電につながる使い方はどれ？",
          choices: ["個別スイッチ付きタップで未使用機器の待機電力を切る", "使わない充電器もすべて挿しっぱなしにする", "タコ足配線を何重にもつなぐ"],
          ans: 0,
          exp: "使わない時間の待機電力をこまめに遮断するのが効果的です。"
        }
      ];

      const templatesHard = [
        {
          q: "【難問】再生可能エネルギーの導入が増える中、昼間の太陽光発電が余りやすい時間帯に電気を使う工夫を何と呼ぶ？",
          choices: ["デマンドレスポンス（上げDR・昼間シフト）", "ブラックアウト", "ベースロード固定"],
          ans: 0,
          exp: "発電量に合わせて需要側（使う時間）をシフトさせる取り組みが注目されています。"
        },
        {
          q: "【難問】製品やサービスの環境負荷を『原料調達→製造→輸送→使用→廃棄』の全工程で評価する手法はどれ？",
          choices: ["LCA（ライフサイクルアセスメント）", "KPI（重要業績評価指標）", "BCP（事業継続計画）"],
          ans: 0,
          exp: "使用時だけでなくライフサイクル全体で見ることで本質的な削減策が見えてきます。"
        }
      ];

      const questions = [];
      for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
        const sceneId = sceneKeys[(i - 1) % sceneKeys.length];
        const spotList = SPOT_NAMES_BY_SCENE[sceneId];
        const spotName = spotList[(i - 1) % spotList.length];

        let diff = "med";
        if (i % 10 >= 1 && i % 10 <= 3) diff = "easy";
        else if (i % 5 === 0) diff = "hard";

        const pool = diff === "easy" ? templatesEasy : diff === "hard" ? templatesHard : templatesMed;
        const tpl = pool[(i - 1) % pool.length];

        // 空間内の360度方位(yaw)と高さ(top)に分散配置
        const yaw = (i * 47 + sceneKeys.indexOf(sceneId) * 31) % 360;
        const top = 32 + ((i * 17) % 34);

        questions.push({
          id: i,
          sceneId,
          spotName,
          diff,
          question: `【${spotName}を調査】${tpl.q}`,
          choices: tpl.choices,
          answerIndex: tpl.ans,
          explanation: tpl.exp,
          yaw,
          top
        });
      }
      return questions;
    }

    // =========================================================
    // 3. ゲーム状態
    // =========================================================
    const state = {
      currentSceneId: "seminar_room",
      yaw: 0, // 0 = 北
      correctIds: new Set(),
      clearedNotified: false,
      isFinishedMode: false,
      questions: generate100SpatialQuestions(),
      isDragging: false,
      dragStartX: 0,
      dragStartYaw: 0
    };

    const viewport = document.getElementById("viewport");
    const panoramaWorld = document.getElementById("panoramaWorld");
    const panoramaGrid = document.getElementById("panoramaGrid");
    const interactiveLayer = document.getElementById("interactiveLayer");
    const locationName = document.getElementById("locationName");
    const locationDesc = document.getElementById("locationDesc");
    const compassHud = document.getElementById("compassHud");
    const toastEl = document.getElementById("toast");

    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
    }

    function normalizeYaw(deg) {
      return ((deg % 360) + 360) % 360;
    }

    // 現在の視点(currentYaw)から見た対象方位(targetYaw)の相対角度(-180 ~ +180)
    function getRelativeAngle(targetYaw, currentYaw) {
      return ((targetYaw - currentYaw + 540) % 360) - 180;
    }

    function getDirectionText(deg) {
      const dirs = ["北", "北東", "東", "南東", "南", "南西", "西", "北西"];
      const idx = Math.round(normalizeYaw(deg) / 45) % 8;
      return `${dirs[idx]}（${Math.round(normalizeYaw(deg))}°）`;
    }

    function updateHud() {
      const solved = state.correctIds.size;
      document.getElementById("correctCount").textContent = String(solved);
      const pct = Math.min(100, Math.round((solved / CLEAR_GOAL) * 100));
      document.getElementById("progressBar").style.width = `${pct}%`;

      if (solved >= CLEAR_GOAL && !state.clearedNotified) {
        state.clearedNotified = true;
        document.getElementById("clearModal").classList.add("open");
      }
    }

    // =========================================================
    // 4. 空間レンダリング（視点に応じて対象物と移動矢印を配置）
    // =========================================================
    function renderSpace() {
      state.yaw = normalizeYaw(state.yaw);
      const scene = SCENES[state.currentSceneId];

      locationName.textContent = scene.name;
      locationDesc.textContent = scene.desc;
      compassHud.textContent = getDirectionText(state.yaw);

      panoramaWorld.style.background = scene.bg;
      // 視点回転に合わせて背景グリッドを水平スクロール
      const gridOffsetX = -(state.yaw * 4);
      panoramaGrid.style.backgroundPosition = `${gridOffsetX}px 0px`;

      interactiveLayer.innerHTML = "";

      // A. このエリアに隠れている問題スポットを描画（視野角 ±65度以内に入ったものだけ見える）
      const sceneQuestions = state.questions.filter(q => q.sceneId === scene.id);
      sceneQuestions.forEach(q => {
        const rel = getRelativeAngle(q.yaw, state.yaw);
        if (Math.abs(rel) > 65) return; // 視界外は隠す＝見回して探す体験

        const screenX = 50 + (rel / 65) * 44; // 6%〜94%
        const isSolved = state.correctIds.has(q.id);

        const el = document.createElement("div");
        el.className = `hotspot-target ${isSolved ? "solved" : ""}`;
        el.style.left = `${screenX}%`;
        el.style.top = `${q.top}%`;

        el.innerHTML = `
          <div class="hotspot-ring">${isSolved ? "✓" : "?"}</div>
          <div class="hotspot-label">${q.spotName} #${q.id}</div>
        `;

        el.onclick = (e) => {
          e.stopPropagation();
          openQuizModal(q);
        };

        interactiveLayer.appendChild(el);
      });

      // B. 隣接空間へ移動するための矢印アイコン（視野角 ±85度以内で表示）
      scene.links.forEach(link => {
        const rel = getRelativeAngle(link.yaw, state.yaw);
        if (Math.abs(rel) > 85) return;

        const screenX = 50 + (rel / 85) * 42;
        const arrowBtn = document.createElement("button");
        arrowBtn.className = "nav-arrow";
        arrowBtn.style.left = `${screenX}%`;
        arrowBtn.style.top = `${link.top}%`;
        arrowBtn.title = link.label;

        arrowBtn.innerHTML = `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4l-7 8h4.5v8h5v-8H19l-7-8z"/>
          </svg>
          <span class="nav-arrow-caption">${link.label}</span>
        `;

        arrowBtn.onclick = (e) => {
          e.stopPropagation();
          moveToScene(link.target);
        };

        interactiveLayer.appendChild(arrowBtn);
      });
    }

    function moveToScene(targetSceneId) {
      const nextScene = SCENES[targetSceneId];
      if (!nextScene) return;
      state.currentSceneId = targetSceneId;
      // 北向き(yaw)は維持したまま移動（方向感覚を保てる設計）
      renderSpace();
      showToast(`「${nextScene.name}」に移動しました`);
    }

    // =========================================================
    // 5. クイズ出題モーダル（見つけた箇所をクリックした時のみ起動）
    // =========================================================
    const quizModal = document.getElementById("quizModal");
    const qDiffTag = document.getElementById("qDiffTag");
    const qMeta = document.getElementById("qMeta");
    const qText = document.getElementById("qText");
    const qChoices = document.getElementById("qChoices");
    const qFeedback = document.getElementById("qFeedback");

    function openQuizModal(q) {
      const scene = SCENES[q.sceneId];
      qDiffTag.className = "diff-tag";
      if (q.diff === "easy") {
        qDiffTag.classList.add("diff-easy");
        qDiffTag.textContent = "易問";
      } else if (q.diff === "hard") {
        qDiffTag.classList.add("diff-hard");
        qDiffTag.textContent = "難問";
      } else {
        qDiffTag.classList.add("diff-med");
        qDiffTag.textContent = "中問";
      }

      qMeta.textContent = `場所：${scene.name} ／ 対象：${q.spotName}（問題 #${q.id}）`;
      qText.textContent = q.question;
      qFeedback.className = "feedback";
      qFeedback.textContent = "";
      qChoices.innerHTML = "";

      q.choices.forEach((choice, idx) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = `${idx + 1}. ${choice}`;
        btn.onclick = () => submitAnswer(q, idx, btn);
        qChoices.appendChild(btn);
      });

      quizModal.classList.add("open");
    }

    function submitAnswer(q, chosenIdx, clickedBtn) {
      const allBtns = qChoices.querySelectorAll(".choice-btn");
      allBtns.forEach(b => (b.disabled = true));

      if (chosenIdx === q.answerIndex) {
        clickedBtn.classList.add("correct");
        const isNew = !state.correctIds.has(q.id);
        state.correctIds.add(q.id);
        qFeedback.innerHTML = `<strong style="color:#86efac;">正解！</strong> ${q.explanation}`;
        if (isNew) {
          showToast(`正解！（現在 ${state.correctIds.size} / ${CLEAR_GOAL} 問）`);
        }
        updateHud();
      } else {
        clickedBtn.classList.add("wrong");
        allBtns[q.answerIndex].classList.add("correct");
        qFeedback.innerHTML = `<strong style="color:#fca5a5;">不正解。</strong> ${q.explanation}`;
      }

      qFeedback.classList.add("show");
      renderSpace();
    }

    // =========================================================
    // 6. 操作イベント（視点ドラッグ・左右ボタン・モーダル制御）
    // =========================================================
    document.getElementById("turnLeftBtn").onclick = () => {
      state.yaw -= 35;
      renderSpace();
    };

    document.getElementById("turnRightBtn").onclick = () => {
      state.yaw += 35;
      renderSpace();
    };

    document.getElementById("northBtn").onclick = () => {
      state.yaw = 0;
      renderSpace();
    };

    document.getElementById("closeQuizBtn").onclick = () => {
      quizModal.classList.remove("open");
    };

    document.getElementById("continueExploreBtn").onclick = () => {
      document.getElementById("clearModal").classList.remove("open");
      showToast("探索モード継続中！残りの箇所も自由に探せます");
    };

    document.getElementById("finishBtn").onclick = () => {
      document.getElementById("clearModal").classList.remove("open");
      showToast(`お疲れさまでした！最終正解数：${state.correctIds.size} / 100問`);
    };

    document.getElementById("resetBtn").onclick = () => {
      state.correctIds.clear();
      state.clearedNotified = false;
      state.currentSceneId = "seminar_room";
      state.yaw = 0;
      updateHud();
      renderSpace();
      showToast("ゼミ室から探索をやり直します");
    };

    // ドラッグで360度見回す
    viewport.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".hotspot-target") || e.target.closest(".nav-arrow")) return;
      state.isDragging = true;
      state.dragStartX = e.clientX;
      state.dragStartYaw = state.yaw;
      viewport.setPointerCapture(e.pointerId);
    });

    viewport.addEventListener("pointermove", (e) => {
      if (!state.isDragging) return;
      const dx = e.clientX - state.dragStartX;
      state.yaw = state.dragStartYaw - dx * 0.32;
      renderSpace();
    });

    viewport.addEventListener("pointerup", () => {
      state.isDragging = false;
    });

    // キーボード左右キーでも視点を回せるように対応
    window.addEventListener("keydown", (e) => {
      if (quizModal.classList.contains("open")) return;
      if (e.key === "ArrowLeft") {
        state.yaw -= 25;
        renderSpace();
      } else if (e.key === "ArrowRight") {
        state.yaw += 25;
        renderSpace();
      }
    });

    // 初期表示
    updateHud();
    renderSpace();
  </script>
</body>
</html>
